version: "3.8"
services:
  mongo-rs0-1:
    image: mongo:7
    container_name: mongo-rs0-1
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017", "--journal"]
    ports:
      - "27017:27017"
    networks:
      - mongo-journal-net
    volumes:
      - rs0_j1_data:/data/db

  mongo-rs0-2:
    image: mongo:7
    container_name: mongo-rs0-2
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27018", "--journal"]
    ports:
      - "27018:27018"
    networks:
      - mongo-journal-net
    volumes:
      - rs0_j2_data:/data/db

  mongo-rs0-3:
    image: mongo:7
    container_name: mongo-rs0-3
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27019", "--journal"]
    ports:
      - "27019:27019"
    networks:
      - mongo-journal-net
    volumes:
      - rs0_j3_data:/data/db

networks:
  mongo-journal-net:
    driver: bridge

volumes:
  rs0_j1_data:
  rs0_j2_data:
  rs0_j3_data:
