version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: lab16_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  lab16:
    build: .
    container_name: lab16_app
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      - MONGO_URI=mongodb://mongo:27017/
    # Remove tty: true for non-interactive run; keep it for docker compose up logs
    stdin_open: false

volumes:
  mongo_data:
