<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}NoSQL Lab 14 – Monitoring & Backup{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --mongo-green: #00684a;
            --mongo-dark:  #001e2b;
            --mongo-slate: #0b1f22;
            --mongo-accent:#00ed64;
            --text-dark:   #1f2328;
            --bg-light:    #f8fafc;
        }
        body {
            background-color: var(--bg-light);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .navbar-custom {
            background: linear-gradient(135deg, var(--mongo-slate) 0%, var(--mongo-dark) 100%);
            border-bottom: 2px solid var(--mongo-green);
            box-shadow: 0 4px 15px rgba(0,0,0,.18);
        }
        .navbar-brand { font-weight: 700; color: #fff !important; letter-spacing: .5px; }
        .nav-link {
            color: #d1d5db !important; font-weight: 500; margin: 0 .35rem;
            transition: color .2s, background-color .2s;
            border-radius: .5rem; padding: .5rem .85rem !important;
        }
        .nav-link:hover, .nav-link.active {
            color: var(--mongo-accent) !important;
            background-color: rgba(0,237,100,.08);
        }
        .hero-banner {
            background: linear-gradient(135deg, #0b1f22 0%, #004d37 100%);
            color: white; padding: 2.25rem 2rem; border-radius: 1rem;
            margin-bottom: 2rem;
            box-shadow: 0 10px 25px rgba(0,104,74,.25);
            border-left: 5px solid var(--mongo-accent);
        }
        .card-custom {
            border: 1px solid #e2e8f0; border-radius: .85rem;
            box-shadow: 0 4px 15px rgba(0,0,0,.04);
            transition: transform .2s ease, box-shadow .2s ease;
            background: #fff;
        }
        .card-custom:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0,0,0,.08); }
        .code-block {
            background: #0f172a; color: #f8fafc; border-radius: .65rem;
            padding: 1rem; font-family: "SFMono-Regular", Consolas, monospace;
            font-size: .88rem; overflow-x: auto;
        }
        .metric-val { font-size: 1.6rem; font-weight: 700; }
        .alert-badge { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.6} }
        .progress { height: 10px; border-radius: 5px; }
        footer {
            margin-top: auto; background: #001e2b; color: #94a3b8;
            padding: 1.5rem 0; border-top: 1px solid #1e293b;
        }
        .log-console {
            background:#0f172a; color:#a3e635; font-family:monospace;
            font-size:.82rem; border-radius:.65rem; padding:1rem;
            min-height:220px; max-height:380px; overflow-y:auto;
            white-space:pre-wrap; word-break:break-all;
        }
        .metric-card-icon { font-size:2rem; opacity:.18; position:absolute; right:1rem; top:1rem; }
        .stat-card { position:relative; overflow:hidden; }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
  <div class="container">
    <a class="navbar-brand" href="/">
      <i class="fa-solid fa-gauge-high text-success me-2"></i>NoSQL Lab 14
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">
            <i class="fa-solid fa-house me-1"></i>Overview
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.path == '/lab1' %}active{% endif %}" href="/lab1">
            <i class="fa-solid fa-chart-line me-1 text-success"></i>Activity 1: Monitor
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.path == '/lab2' %}active{% endif %}" href="/lab2">
            <i class="fa-solid fa-box-archive me-1 text-warning"></i>Activity 2: Backup
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container py-4 flex-grow-1">
  {% block content %}{% endblock %}
</div>

<footer>
  <div class="container text-center">
    <div class="row align-items-center">
      <div class="col-md-6 text-md-start mb-2 mb-md-0">
        <span class="fw-bold text-white">NoSQL Lab 14: Monitoring, Backup &amp; Restore</span>
        <span class="badge bg-secondary ms-2">v1.0</span>
      </div>
      <div class="col-md-6 text-md-end">
        <span class="text-light me-3">
          <i class="fa-solid fa-user-graduate me-1 text-success"></i>M Gouthami (24BTRCL130)
        </span>
        <span class="text-secondary">
          <i class="fa-brands fa-docker me-1"></i>gouthudocker/nosql-lab14:latest
        </span>
      </div>
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
