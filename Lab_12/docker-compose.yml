services:

  mongo:
    image: mongo:7.0
    container_name: mongo_lab12
    restart: unless-stopped
    ports:
      - "27019:27017"
    volumes:
      - mongo_lab12_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build: .
    image: gouthudocker/nosql-lab12:latest
    container_name: nosql_lab12_web
    restart: unless-stopped
    ports:
      - "5002:5000"
    environment:
      MONGO_URI: mongodb://mongo:27017/
      PORT: 5000
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_lab12_data:
