version: "3.9"

services:
  web:
    image: gouthudocker/nosql-lab17:latest
    container_name: nosql_lab17_web
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: "5000"
      MONGO_URI: "mongodb://host.docker.internal:27017/"
      MONGO_URI_STANDALONE: "mongodb://host.docker.internal:27017/"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - lab17_net

networks:
  lab17_net:
    driver: bridge
