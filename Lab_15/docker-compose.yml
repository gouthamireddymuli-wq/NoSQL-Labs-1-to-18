version: "3.9"

services:
  web:
    image: gouthudocker/nosql-lab15:latest
    container_name: nosql_lab15_web
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5005:5000"
    environment:
      PORT: "5000"
      MONGO_URI: "mongodb://admin:AdminPass123!@mongo-rs0-1:27017,mongo-rs0-2:27017,mongo-rs0-3:27017/admin?replicaSet=rs0&authSource=admin"
      MONGO_URI_STANDALONE: "mongodb://admin:AdminPass123!@mongo-rs0-1:27017/?authSource=admin"
    networks:
      - lab15_net
      - nosqllab13_default

networks:
  lab15_net:
    driver: bridge
  nosqllab13_default:
    external: true
